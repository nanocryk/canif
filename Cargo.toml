[package]
name = "canif"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Run reviewed scripts with validated arguments, so AI agents can be allowlisted on one command"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nanocryk/canif"
readme = "README.md"
keywords = ["cli", "scripts", "ai-agents", "allowlist", "claude"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src",
    "/tests",
    "/examples",
    "/skill",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
indexmap = { version = "2.14.2", features = ["serde"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
